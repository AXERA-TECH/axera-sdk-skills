name: Publish tagged source release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.snapshot.outputs.commit }}
    steps:
      - name: Resolve and validate tag input
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$PUSH_TAG"
          fi
          [[ "$tag" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]
          git check-ref-format "refs/tags/$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the exact tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind checkout to tag commit
        id: snapshot
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$TAG"
          commit="$(git rev-list -n 1 "refs/tags/$TAG")"
          test "$(git rev-parse HEAD)" = "$commit"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Verify public manifest, layout, and fingerprints
        shell: bash
        run: python3 -I scripts/install_skills.py --verify
      - name: Reject symlinks and submodules in the exact tag
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import subprocess
          for entry in subprocess.check_output(['git', 'ls-tree', '-rz', 'HEAD']).split(b'\0'):
              if entry:
                  assert entry.split(b' ', 1)[0] in (b'100644', b'100755'), 'Unsupported Git entry'
          PYCODE

  publish:
    if: ${{ github.server_url == 'https://github.com' }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This checkout supplies the publisher only. The write-token job never runs
      # validation or any code from skills/.
      - name: Check out publisher at the exact tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          sparse-checkout: scripts/publish_release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Create or verify source Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        shell: bash
        run: |
          python3 scripts/publish_release.py \
            --repo "$REPOSITORY" \
            --tag "$TAG" \
            --commit "$COMMIT"
