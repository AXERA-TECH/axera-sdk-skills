prompt: |
  使用已安装的 sdk-bsp-rpmsg 技能，只依据技能资料回答当前目录的 request.md。
  不修改 SDK 或运行硬件命令。将结果写入 out/result.json，必须是单个 JSON 对象，不含 Markdown 围栏。
  输出字段：platform 为目标平台 id 字符串；qnx_supported 为该平台是否支持 QNX 的 JSON 布尔值；
  sync_m57_qnx_changes 为 M57 QNX 专属修改是否需要同步到该平台的 JSON 布尔值。
  可增加 explanation 字符串说明判断依据；解释措辞不参与自动评分。不要用字符串代替布尔值。
expect:
  files:
    - path: out/result.json
      exists: true
      min_bytes: 2
  assert: assert.sh
