prompt: |
  目标平台为 AX615；实际板型、项目、Flash、DDR、Sensor 和 SDK 版本未知。
  使用已安装的 sdk-audio-aec-diag-skill 分析当前目录的 proc.txt、capture.txt 和 PCM 录音。
  客户问题：播放音量达到产品要求时回声残留明显。请根据所给材料分析原因，给出有证据的判断、处理建议和复测方法；方案需满足目标播放响度和弱近端拾音要求。
  按技能 references/contract.md 整理输入并实际测量录音；格式、采集点和轮次以 capture.txt 为准。先读 measurements.md，按需提取 JSON，复用有效结果。
  按契约交付 out/ 下的 measurements.json、measurements.md、diagnosis.json、diagnosis.md；完成 diagnosis.json 后用 scripts/render_report.py --out out 生成并校验 Markdown，最后简短交付路径。
  不交互补问；缺失材料、候选解释和区分实验写入报告，未执行的板端复测如实记录。
expect:
  files:
    - path: out/measurements.json
      exists: true
      min_bytes: 50
    - path: out/measurements.md
      exists: true
    - path: out/diagnosis.json
      exists: true
      min_bytes: 100
    - path: out/diagnosis.md
      exists: true
      min_bytes: 80
  assert: assert.sh
