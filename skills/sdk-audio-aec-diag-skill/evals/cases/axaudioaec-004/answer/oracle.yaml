schema_version: 1
id: axaudioaec-004
root_cause: MIC 存在明显满幅端点削顶特征，REF 未见满幅端点；可高置信度识别 MIC 输入分支的削顶。其对残留回声的影响及具体失真级仍需增益对照和相邻测点验证。
required_concepts:
- 引用 MIC rail_fraction/满幅样本并对照 REF；端点为零不能排除其他失真。
- 建议保持目标播放条件进行 MIC 增益单变量对照，不声称已验证改善。
- 核查 ALC 和相邻前级测点，定位首次引入失真的一级，按单变量修正。
- 不以低于产品要求的播放音量作为最终解决；验收目标响度和弱近端拾音及五类场景。
forbidden_conclusions:
- 只需降低播放音量即可判定已解决。
- 已确定某个 ADC、PA 或模拟器件损坏。
- rail_fraction=0 等于完全无失真。
- 已执行降音量或降 MIC 增益对照并确认改善。
allowed_unknowns:
- 具体模拟前级、ALC 状态、绝对增益与校准声压级。
- 降低 MIC 增益后弱近端拾音是否满足要求。
required_additional_evidence:
- 保持目标播放条件的相邻采集点、增益读回及 ALC 状态。
- 修正后的目标响度、弱语音/双讲/静音与重复触发验收。
measurement_expectations:
- paths:
  - fixtures/AiCard0_Dev0_vqeIn.pcm
  - fixtures/AiCard0_Dev0_vqeRef.pcm
  interpretation: MIC 满幅样本为 2638/192000（约 1.374%），REF 满幅样本为 0；削顶对回声的影响需后续对照验证。
evidence_signatures:
  fixtures/capture.txt:
  - lines: 7-9
    text: '本轮连续录制 12 秒，远端播放语音，近端保持安静。

      播放处于产品目标档位，远端听到明显回声。

      本次提交为一轮录音。'
  fixtures/proc.txt:
  - section: AI DEV ATTR
    device:
      AiCardId: 0
      AiDevId: 0
    lines: 5-7
    text: |-
      -------- AI DEV ATTR ------------------------
      AiCardId        AiDevId         ChnCnt          Samplerate      PeriodSize      PeriodCount     LinkMode        LayoutMode      AiDepth         f2mic_distance  enBitwidth
      0               0               2               16000           160             8               0               MIC_REF         30              0.000000        16bit
  - section: AI DEV VQE ATTR
    device:
      AiCardId: 0
      AiDevId: 0
    lines: 11-13
    text: |-
      -------- AI DEV VQE ATTR ------------------------
      AiCardId        AiDevId         VqeEnabled      SampleRate      FrameSamples    AecMode         NsEnable        VadEnable       AgcEnable
      0               0               1               16000           160             1               1               0               0
  - section: AI DEV AEC ATTR
    device:
      AiCardId: 0
      AiDevId: 0
    lines: 14-16
    text: |-
      -------- AI DEV AEC ATTR ------------------------
      AiCardId        AiDevId         VqeEnabled      AecMode         SupOrRouting    ComfortNoise    ExtFilterEnable SndCardBufMs    SupEX           SupEx_level
      0               0               1               1               2               1               1               0               0               0
  - section: AI DEV DUMP AND BYPASS
    device:
      AiCardId: 0
      AiDevId: 0
    lines: 35-37
    text: |-
      -------- AI DEV DUMP AND BYPASS ------------------------
      AiCardId        AiDevId         Dump            DumpPath        DumpCount       Bypass
      0               0               0               /tmp/aec/       1200            0
expected_confidence: high
confidence_scope: MIC 满幅削顶特征置信度高；具体失真级、回声因果关系及调整效果待验证。
evaluation_notes:
- 完整事实仅描述现有固定输入，不虚构隐藏补丁事实；不得要求未知的 SDK 版本、硬件机制或参数值。
- required_concepts 按含义及其证据关系评审，不要求固定措辞；否定、引用客户说法及待验证假设不等于断言根因。
- forbidden_conclusions 仅在报告将其肯定为根因、已解决或已验证事实时判负；查看上下文与实际证据。
- 审阅结论、证据归属、推理边界、措施与反证、回归五个维度；所有必答项需覆盖，允许未知不扣分。
- 独立 assert.sh 检查结构、测量、分类及部分文本 smoke；通过不等于 oracle 语义审阅或声学验收通过。
- 所有用例均未提供修正后板端验收；不得判为 resolved，也不得虚构已运行复测。
