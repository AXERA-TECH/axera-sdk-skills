schema_version: 1
id: axaudioaec-005
root_cause: 输入展示双讲时近端声音断续及首字丢失，输出包含 AEC、NS/NSADV、AGC、VAD 等完整上行处理。输入/输出可观察到语音保真差异，但缺少单变量对照，无法唯一归因某个处理模块。
required_concepts:
- 按 capture 划分静音、远端单讲、近端单讲和双讲；相同近端内容按片段内相对位置比较。
- 结合 MIC 与完整上行输出，识别近端语音保真问题，而非把静音区整体平均当作吞音证据。
- 读回完整 AEC/NS/NSADV/AGC/VAD 配置，保留处理组合的候选解释。
- 一次只改一项，保存原值、读回并复测；同时验收近端首字/可懂度和回声，不能以牺牲任一方换取通过。
forbidden_conclusions:
- 仅凭输出吞音即确认 AEC、NS、VAD 或 AGC 中某一项为唯一根因。
- 关闭 AEC 后近端清楚就判定解决，或通过静音掩盖回声。
- 完整上行输出当作纯 AEC 输出，并以其能量差认定 AEC 抑制量。
allowed_unknowns:
- 各处理模块对吞音的独立贡献及是否存在组合效应。
- 参数最优值、客户验收阈值和调整后效果。
required_additional_evidence:
- 匹配版本的完整配置读回和逐项调整前后三路对照，保留片段时间定位。
- 包含弱语音、首字及重叠讲话的近端保真与回声联合验收。
measurement_expectations:
- paths:
  - fixtures/AiCard0_Dev0_vqeIn.pcm
  - fixtures/AiCard0_Dev0_vqeRef.pcm
  - fixtures/AiCard0_Dev0_vqeOut.pcm
  interpretation: 按 0–2/22–24s 静音、2–8s 远端、8–14s 近端、14–22s 双讲分段；保持片段相对位置，比较输入与输出，不能据全段能量判模块根因。
evidence_signatures:
  fixtures/capture.txt:
  - lines: 7-11
    text: '本轮连续录制 24 秒；以下时段均相对 sample 0。

      0–2 s 静音，2–8 s 远端单讲，8–14 s 近端单讲，14–22 s 双讲，22–24 s 静音。

      近端和远端为不同说话人；近端单讲与双讲播放相同的近端语音内容，各段从该语音起点开始。

      远端单讲回声较轻，近端单讲清楚；两边同时讲话时近端声音断续、首字丢失。

      本次提交为一轮录音。'
