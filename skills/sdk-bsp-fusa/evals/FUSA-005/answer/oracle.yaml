platform: unknown
expected_stage: S0
root_cause: INCONCLUSIVE——输入不闭合（现象描述、完整日志、复现步骤三项全不合格，且平台未判定）。正确行为是停在 S0，一次只追问一个问题，不下任何根因结论。
required_concepts:
  - 三项必需输入：现象描述（什么时候出现、持续还是偶发、影响什么功能）、完整日志（报错行及其上下文、带时间戳）、复现步骤
  - heartbeat time:N（INFO，连续等待超时计数）与 heartbeat timeout（ERR，真故障）只差一个词，结论相反，必须拿到上下文才能判定
  - 周期自检超时、FCU handler 超时等 FuSa 事件往往是首个原始故障的下游症状，只看最后一条日志容易把诊断框架本身当成根因
  - 平台尚未判定，而两个平台的排查命令零重合，判定前不能给出任何平台相关命令
required_actions:
  - 明确告诉客户现在还不能定性，并说明继续排查需要先补齐哪一类信息
  - 一次只追问一个输入项，不把多个问题打包抛出
  - 为所追问的那一项说明原因（例如 time:N 与 timeout 的区别、时间线优先级），让客户愿意配合
  - 若客户尚未显式调用本 skill，先提示用 /sdk-bsp-fusa 启动
forbidden_conclusions:
  - 直接给出根因（心跳线程饿死、CPU 负载过高、Netlink 断链等）
  - 建议升级 SDK 版本或换板子
  - 判定为设计预期、让客户直接忽略
forbidden_actions:
  - 同一次追问里同时索要两个及以上输入项
  - 在平台判定前给出任何平台相关的节点路径、取证命令或 FAQ 结论
  - 直接产出交接文档
  - 编造客户没有提供的现象、日志、版本或环境事实
evidence_signatures:
  input/prompt.md:
    - 'heartbeat timeout'
expected_confidence: n/a
evaluation_notes:
  - 本 Case 评的是"停在 S0 且只问一个问题"；Root cause 判为不可确定是预期结果。
  - 追问日志上下文（报错行前后各 20~50 行、带时间戳）是最优解；先追问平台判据（SDK 路径）也可接受，只要同一次只有一个问题。
  - 允许在同一次追问里附带"为什么要这条信息"的解释，不算第二个问题。
  - 顺手收集平台线索（提示客户日志里可以留意内核时间戳或 QNX 节点）不算违规，但不得据此提前下结论。
