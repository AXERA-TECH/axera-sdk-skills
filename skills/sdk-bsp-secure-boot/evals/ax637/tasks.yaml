version: 1

# ax637 平台验收测试任务
platform: ax637

tasks:

  - id: acceptance-ax637-routing
    description: 未指定具体 PLAT 时识别 AX637 SDK，并收集 Secure Boot 目标参数
    fixture: evals/fixtures/ax637
    input: |
      使用 sdk-bsp-secure-boot skill 回答问题：帮我配置 Secure Boot ？
    assertions:
      - contains: "AX637"
      - contains: "m57"
      - contains_any: ["PLAT", "启动介质"]
      - contains: "eFuse"
      - contains: "RSA"
      - contains: "dm-verity"
      - not_contains: "demo_only_nand/config.mk"

  - id: acceptance-ax637-config-build
    description: AX637 NAND 平台开启 Secure Boot 后核对配置、编译与 eFuse 安全边界
    fixture: evals/fixtures/ax637
    input: |
      使用 sdk-bsp-secure-boot skill 回答问题：对 PLAT ax637_demo_only_nand 平台  开启 Secure Boot  、efuse未烧写、RSA 2048，固件加密不开启，dm-verity：关闭
    assertions:
      - contains: "ax637_demo_only_nand"
      - contains: "SECURE_BOOT"
      - contains_any: ["TRUE", "开启"]
      - contains: "SIGN_USE_RSA3072"
      - contains: "FALSE"
      - contains: "ENABLE_CIPHER"
      - contains: "ROOTFS_DMVERITY"
      - contains: "ROOTFS_FS_TYPE"
      - contains: "UBI"
      - contains_any: ["编译", "make -C build", "dry-run"]
      - contains_any: ["未烧写", "不烧写", "不会烧写"]

  - id: acceptance-ax637-spl-rsa-failure
    description: 根据 SBL 的 RSA -9 日志定位被破坏的 SPL slot 0 镜像
    fixture: evals/fixtures/ax637
    input: |
      使用 sdk-bsp-secure-boot skill 回答问题：
      secure cipher rsa verify failed(-9)
      Secure boot: mark spl slot:0 partition as failed
      怎么定位？
    assertions:
      - contains: "-9"
      - contains_any: ["SBL", "SBL -> SPL", "SPL"]
      - contains_any: ["slot 0", "slot:0"]
      - contains_any: ["RSA 验签", "签名失败", "signature-mismatch"]
      - contains: "u-boot-spl_signed--data-corrupt.img"
      - contains_any: ["sha256sum", "cmp"]
      - contains_any: ["0x600", "1537"]
      - not_contains: "优先检查 dm-verity"

  - id: acceptance-ax637-rsa-keypair
    description: AX637 生成 RSA 密钥对需给出 PKCS#1 公钥命令并同步 DTB 公钥
    fixture: evals/fixtures/ax637
    input: |
      使用 sdk-bsp-secure-boot skill 回答问题：在 ax637_demo_only_nand 平台生成新的 RSA 密钥对（RSA-2048），并同步 U-Boot DTB 公钥
    assertions:
      - contains: "openssl genrsa"
      - contains: "-RSAPublicKey_out"
      - contains: "PKCS#1"
      - contains: "extract_pkey_param.py"
      - contains: "m57-keys.dtsi"
      - contains: "key-akcipher2048"
      - not_contains: "BEGIN PUBLIC KEY"

  - id: acceptance-ax637-aes-efuse
    description: AX637 AES Key 与 eFuse 烧写需覆盖工具分工、EFUSE_WRITE_ENABLE 与 bondoption
    fixture: evals/fixtures/ax637
    input: |
      使用 sdk-bsp-secure-boot skill 回答问题：在 ax637_demo_only_nand 平台生成新 AES 密钥加密启动固件，并说明如何烧写 eFuse（Root Key / FEK / PKH / bondoption）
    assertions:
      - contains: "openssl rand -hex 32"
      - contains: "aes-256.key"
      - contains: "sample_efuse_key"
      - contains: "sample_efuse"
      - contains: "EFUSE_WRITE_ENABLE"
      - contains: "rootkey random"
      - contains: "pubkey"
      - contains: "aeskey"
      - contains: "bondoption"
      - contains_any: ["ax_efuse_key aeskey", "改源码", "aeskey_static_array"]

  - id: acceptance-ax637-rsa-pss
    description: AX637 配置项必须体现 SIGN_USE_RSA_PSS
    fixture: evals/fixtures/ax637
    input: |
      使用 sdk-bsp-secure-boot skill 回答问题：ax637_demo_only_nand 平台 Secure Boot 有哪些配置项，SIGN_USE_RSA_PSS 是什么
    assertions:
      - contains: "SIGN_USE_RSA_PSS"
      - contains: "PKCS#1-v1.5"
      - contains_any: ["SBL 之后", "后段", "SPL"]
      - contains: "SIGN_USE_RSA3072"
