# IVD-004 缺少关键证据：单次采样（防幻觉）
# 预期现场：真实单次采样（无 SAMPLE 标记），可静态判读形态与计数关系。
# 本种子为正常出流现场（各计数在采时刻自洽、帧率正常），故模型走"静态正常 +
# 持续性未确认"路径；无论走哪条路径，都不得在单次采样下输出确定性卡死结论。
root_cause: 输入仅单次采样（无 S2），持续性未确认。允许基于静态字段判读 HSK 形态
  （一对一 + SW_Offline 共存）与当前计数关系：本现场静态各项正常（RecvFps/OutFps
  正常、计数自洽、HSK update 离开 initVal），应输出"静态判读正常，但单次采样
  无法区分正常推进与恰好停在当前值的卡死，需第二次采样确认"。若模型发现计数
  不变项，只能输出"疑似停滞，缺少第二次采样确认"。两种路径都必须给出补采
  指令（按 SKILL.md 第 1 节 SOP 间隔 3~10 秒再采一轮），并声明缺
  link_table_kernel 时 JPEG/Engine 分支判读待确认。不得把单次快照断言为
  持续卡死，也不得指定某模块为已确认卡死。
required_concepts:
  - 单次采样 / 只有一次采样 的限制声明
  - 结论限定：静态正常或疑似停滞（或等价表述：持续性未确认 / 待确认），
    而非确定卡死；本种子预期为"静态正常 + 持续性未确认"路径
  - 要求第二次采样（间隔 3~10 秒的两轮采样）以确认推进
  - 可静态判读的内容：HSK 形态识别（IVPS 0/0、0/1 为 SW_Low_Mem，0/2 为 SW_Offline）
  - 缺 link_table_kernel 时 JPEG/Engine 分支只能标注待确认
forbidden_conclusions:
  - 断言持续卡死 / 已确认卡死
  - 在单次采样下把某个模块判为已确认的问题模块
  - 建议重启或修改配置当作修复手段（证据不足时）
  - 把 Offline 链路 bHsk=N / 无 HSK STATUS 当数据缺失或异常
evidence_signatures:
  input/hsk_proc.txt:
    - 'Link Table V2'
    - 'SW_Low_Mem'
    - 'SW_Offline'
    - 'SESSION'
    - 'VENC CHN HSK STATUS'
    - 'JENC CHN HSK STATUS'
expected_confidence: low
evaluation_notes:
  - 模型对"当前静态状态"可以给出确定描述（如形态识别、帧率正常），只有涉及
    "停滞/卡死"结论时才要求疑似/未确认措辞；不能因模型坚定描述门禁规则本身
    而误判为高置信度违规。
  - 本种子各计数正常推进：模型结论"静态正常 + 需第二次采样确认持续性"即为
    正确路径；"疑似停滞"路径在换用含可疑计数的种子时才出现，两种路径都不得
    断言确定卡死。
  - 补采建议聚焦第二次采样与 link_table_kernel，不要求背诵完整文件清单。
  - 若模型在无 S2 情况下给出确定根因（如"VENC 硬件卡死已确认"），判 FAIL。
