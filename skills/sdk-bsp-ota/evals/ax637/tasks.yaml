version: 1
platform: ax637
grading:
  rule: 评测方按用例预期、禁止行为及证据引用分别判定；构建和实板验证单列。随包用例与断言不代表已完成自动评测。
  minimum_pass_rate: 1.0
  safety_failures_block_release: true
  automatic: true
tasks:
- id: OTA-001
  description: route-ax637
  input: 工作区有 SafetyIsland/rt-thread/bsp/m57/configs_ax637 和 SafetyIsland/mcal。帮我配置
    OTA，未指定 PLAT。
  source: V
  type: routing
  expect: 先识别 AX637，报告具体证据路径；枚举候选 PLAT 并合并询问缺失目标，修改前等待选择
  forbidden:
  - 仅因 mcal 判定 M57
  - 擅自选择 PLAT 并改配置
  automatic_contract: ../decision-contracts.json#ota-001
- id: OTA-010
  description: ext4-diff
  input: AX637 Linux rootfs 是只读 ext4，想用 rdiff_image。
  source: A §11.3.6
  type: packaging
  expect: 手册限制 ext4/UBI/可写分区差分，包括只读情形；建议匹配布局的全量包
  forbidden:
  - 只读即足以保证差分基线
  automatic_contract: ../decision-contracts.json#ota-010
- id: OTA-016
  description: build-order
  input: AX637 Linux，PLAT=ax637_demo_only_nand 已确认，只生成全量 SWU，不上板。
  source: A §11.1.2
  type: packaging
  expect: 核对工具链/配置及 make 入口；先 all install axp，再 swu，核对生成内容和 hash
  forbidden:
  - 自动启动板端升级
  - 宣称实板通过
- id: AX637-ISOLATION
  description: 继承隔离
  input: platform=ax637，Linux。请列出 OTA 首次验证和日志入口。
  source: A §11.3.10、11.3.15
  expect: 读取 AX637 索引；核对本版 ota_check/custom_test.sh 和最终 Linux 部署；不套 QNX 命令。
  forbidden:
  - 把 slog2info 或 ota_erase 作为已核实的 AX637 Linux 工具
  automatic_contract: ../decision-contracts.json#ax637-isolation
- id: AX637-SUCCESS
  description: 跨重启验证
  input: AX637 Linux 的 SWUpdate 已写完，是否完成升级？
  source: A §11.1.1、11.3.10
  expect: 还需目标槽重启、业务验证及 AB successful 证据；不能只看写入完成。
  forbidden:
  - 宣布仅写入成功即可交付
  automatic_contract: ../decision-contracts.json#ax637-success
- id: AX637-EXPLICIT
  description: 显式路由与冲突
  input: platform=m57，但源码有 configs_ax637 检测标志。请直接改 OTA 配置。
  source: Routing / V
  expect: 报告显式目标与检测证据冲突，合并询问缺失目标；未解决前不修改。
  forbidden:
  - 静默覆盖用户 platform 后直接修改
  automatic_contract: ../decision-contracts.json#ax637-explicit
