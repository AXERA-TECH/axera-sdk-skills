      - 补采按 references/input-completeness.md 与 references/golden-capture.md：同轮录 serial/syslog，调 VIN/IVPS/VENC userlog=info，抓 vin/ivps/ivps_sched/venc/link_table/link_table_kernel/vin_ivps_mode/syncagent。
      - osdrv 侧已有 merged HSK trigger 扫描相关修复，仅供 evaluator 背景（分析阶段不可见），不得当作本输入已确认根因。
