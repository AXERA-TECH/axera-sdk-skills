tasks:
  - name: provision-m57-ubuntu-host
    prompt: "为 M57 SDK 准备一台 Ubuntu 主机，安装依赖和交叉工具链，并展开 SDK 源码。"
    expect: "识别平台为 M57，列出精确工具链版本（ARM64 9.2、Linaro 7.5）、验证命令和 sdk_unpack.sh 检查。"
  - name: repair-m57-sdk-sources
    prompt: "M57 编译机上 sdk_unpack.sh 的默认下载源失效时，如何准备 Linux、U-Boot、ATF 和 OP-TEE 源码？"
    expect: "说明各参数（-k, -u, -a, -o）对应的本地归档及完成后的目录验证。"
