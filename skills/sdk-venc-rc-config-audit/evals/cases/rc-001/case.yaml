prompt: |
  使用已安装的 sdk-venc-rc-config-audit 技能读取当前目录的 venc_proc.txt。
  现场现象：主码流（通道 0）为 2688x1520@30fps 的 H.264 CBR 编码，用户反馈画面每隔约 1 秒出现一次清晰度下降再恢复（呼吸效应）；子码流（通道 1）未见异常。
  按技能规定完成码控配置审查，将最终答复完整写入 result.md。
  不要读取或猜测任何评测答案；只使用当前目录的 venc_proc.txt、已安装技能中的 references 与脚本。
expect:
  files:
    - path: result.md
      exists: true
      min_bytes: 200
  assert: assert.sh
