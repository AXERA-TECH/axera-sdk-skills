# RC-003 相似症状不同根因：双通道码率均超约 20%，但机制不同
# 现场为 derived（真实双通道样本为基底，chn0 改 MaxQp、chn1 目标码率本身偏低）。
root_cause: 两个通道同为 H.264 CBR、30fps，实际码率 chn0=5000（超限 22.1%）、
  chn1=490（超限 22.5%），症状相同但根因不同：
  - 通道 0（2688x1520，目标 4096）：MinQp/MaxQp=10..30、MinIQp/MaxIQp=10..30，
    QP 上限被配置得过低，编码器压缩能力不足，复杂场景 QP 无法继续抬高，码率
    压不下去——根因是 QP 上限配置不当，建议放宽到文档允许范围（副作用：画质下降）。
  - 通道 1（720x576，目标 400）：QP 范围已是满量程 10..48，编码器仍有压缩空间
    仍超限——根因不是 QP 上限，而是目标码率 400 kbps 相对 720x576@30fps 的场景
    需求配置偏低，建议提高目标码率，或降低分辨率/帧率（副作用：业务指标变化）。
required_concepts:
  - 分通道给出不同根因（不得用同一结论覆盖两路）
  - chn0：MaxQp/MaxIQp=30 上限过低、压缩能力不足导致超限
  - chn0：建议放宽 QP 上限，并说明画质下降的副作用
  - chn1：QP 范围 10..48 已是满量程仍超限，排除 QP 上限问题
  - chn1：根因为目标码率相对分辨率/帧率/场景偏低，建议提高目标码率或降分辨率/帧率
forbidden_conclusions:
  - 把两路归为同一根因（都用 QP 上限过低或都用目标码率偏低解释）
  - 对 chn1 也把放宽 QP 上限作为主要修复手段
  - 把 RecvFps/OutFps 偏差（<10%）判为帧率异常
evidence_signatures:
  input/venc_proc.txt:
    - '[SDK version]: ax_venc V3.15.0_20260929153144 Sep 29 2026 15:50:46 JK'
    - '0     CBR    30    30    4096'          # chn0 RC ATTR 1
    - '10      30      10      30'             # chn0 QP 上限 30
    - '1     CBR    30    30    400'           # chn1 RC ATTR 1
    - '10      48      10      48'             # chn1 满量程 10..48
    - '5000'                                   # chn0 实测码率
    - '490'                                    # chn1 实测码率
expected_confidence: high
evaluation_notes:
  - 两路 RecvFps/OutFps 偏差均在 10% 以内，帧率正常；据此排除帧率异常即可。
  - chn0 实测 5000 相对目标 4096 超 22.1%，chn1 实测 490 相对目标 400 超 22.5%。
  - 建议给出调整步骤（逐档放宽/复测平均码率与峰值）符合 symptom-rules，属正确方向。
